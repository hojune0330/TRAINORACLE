<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>비밀번호 변경</title></head><body>
<h1>비밀번호 변경</h1>
<p>요청한 계정의 비밀번호를 바꾸려면 아래 링크를 열어 주세요. 본인이 요청하지 않았다면 변경하지 않아도 됩니다.</p>
<p><a href="{{ .RedirectTo }}#token_hash={{ .TokenHash }}&amp;type=recovery">새 비밀번호 입력하기</a></p>
<p>링크를 연 화면에서 변경할 이메일을 확인한 뒤 새 비밀번호를 입력해 주세요. 변경을 마치면 새 비밀번호로 다시 로그인합니다.</p>
</body></html>
