name: TrainOracle CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            runtime-evidence/d9-evaluator/package-lock.json
            impl/package-lock.json

      - name: Validate reasoning-tier work harness
        run: |
          node --test specs/test-packages/reasoning-tier-harness.test.mjs
          node specs/test-packages/reasoning-tier-harness.mjs validate
          node specs/test-packages/validate-formal-approval-foundation.mjs
          node --test specs/test-packages/validate-personalized-prescription-policy.test.mjs
          node specs/test-packages/validate-personalized-prescription-policy.mjs
          node --test specs/test-packages/validate-v2-seed-05-owner-activation.test.mjs
          node specs/test-packages/validate-v2-seed-05-owner-activation.mjs
          node --test specs/test-packages/validate-middle-distance-source-adoption.test.mjs
          node specs/test-packages/validate-middle-distance-source-adoption.mjs
          node specs/test-packages/validate-formation-p1-target-plans.mjs
          node specs/test-packages/test-wo016-gate-verifier.mjs
          node --test specs/test-packages/validate-detailed-prescription-catalog.test.mjs
          node specs/test-packages/validate-detailed-prescription-catalog.mjs
          node --test specs/test-packages/validate-v2-seed-05-activation-packet.test.mjs
          node specs/test-packages/validate-v2-seed-05-activation-packet.mjs
          node --test specs/test-packages/validate-advisory-session-recommender.test.mjs
          node specs/test-packages/validate-advisory-session-recommender.mjs
          node --test specs/test-packages/validate-dependency-security-audit.test.mjs
          node specs/test-packages/validate-dependency-security-audit.mjs
          node --test specs/test-packages/validate-decoration-assets.test.mjs
          node specs/test-packages/validate-journal-decoration-contract.mjs
          node --test specs/test-packages/validate-journal-decoration-contract.test.mjs
          node --test specs/test-packages/validate-personalized-prescription-v2-authority.test.mjs
          node specs/test-packages/validate-personalized-prescription-v2-authority.mjs
          node --test specs/test-packages/validate-personalized-prescription-v2-taper-authority.test.mjs
          node specs/test-packages/validate-personalized-prescription-v2-taper-authority.mjs
          node --test specs/test-packages/validate-personalized-prescription-v2-race-placement.test.mjs
          node specs/test-packages/validate-personalized-prescription-v2-race-placement.mjs

      - name: Install D9 evaluator dependencies
        working-directory: runtime-evidence/d9-evaluator
        run: npm ci

      - name: Run D9 evaluator evidence tests
        working-directory: runtime-evidence/d9-evaluator
        run: npm test

      - name: Install impl dependencies
        working-directory: impl
        run: npm ci

      - name: Typecheck impl skeleton
        working-directory: impl
        run: npm run typecheck

      - name: Run impl skeleton tests
        working-directory: impl
        run: npm test

  app-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Run app unit tests
        working-directory: app
        run: npm test

      - name: Typecheck app and browser tests
        working-directory: app
        run: |
          npm run typecheck
          npm run typecheck:e2e

      - name: Build production app
        working-directory: app
        run: npm run build

  app-browser:
    needs: app-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Run app browser scenarios
        working-directory: app
        run: npm run test:e2e

  deploy-pages:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs:
      - contract-tests
      - app-quality
      - app-browser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: trainoracle-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build hosted app
        working-directory: app
        env:
          VITE_ACCOUNT_PUBLIC_ENABLED: ${{ vars.TRAINORACLE_ACCOUNT_PUBLIC_ENABLED }}
          VITE_FEATURE_SYNC: ${{ vars.TRAINORACLE_FEATURE_SYNC }}
          VITE_FEATURE_SHARING: ${{ vars.TRAINORACLE_FEATURE_SHARING }}
          VITE_FEATURE_PLAN_PROPOSALS: ${{ vars.TRAINORACLE_FEATURE_PLAN_PROPOSALS }}
          VITE_FEATURE_EXPERIMENTAL_FATIGUE: ${{ vars.TRAINORACLE_FEATURE_EXPERIMENTAL_FATIGUE }}
          VITE_FEATURE_DECORATION_SHOP: ${{ vars.TRAINORACLE_FEATURE_DECORATION_SHOP }}
          VITE_FEATURE_PRODUCT_ANALYTICS: ${{ vars.TRAINORACLE_FEATURE_PRODUCT_ANALYTICS }}
          VITE_FEATURE_FEEDBACK_BOARD: ${{ vars.TRAINORACLE_FEATURE_FEEDBACK_BOARD }}
          VITE_KILL_ACCOUNT: ${{ vars.TRAINORACLE_KILL_ACCOUNT }}
          VITE_KILL_SYNC: ${{ vars.TRAINORACLE_KILL_SYNC }}
          VITE_KILL_SHARING: ${{ vars.TRAINORACLE_KILL_SHARING }}
          VITE_KILL_PLAN_PROPOSALS: ${{ vars.TRAINORACLE_KILL_PLAN_PROPOSALS }}
          VITE_KILL_EXPERIMENTAL_FATIGUE: ${{ vars.TRAINORACLE_KILL_EXPERIMENTAL_FATIGUE }}
          VITE_KILL_DECORATION_SHOP: ${{ vars.TRAINORACLE_KILL_DECORATION_SHOP }}
          VITE_KILL_PRODUCT_ANALYTICS: ${{ vars.TRAINORACLE_KILL_PRODUCT_ANALYTICS }}
          VITE_KILL_FEEDBACK_BOARD: ${{ vars.TRAINORACLE_KILL_FEEDBACK_BOARD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_PRIVACY_POLICY_URL: ${{ vars.TRAINORACLE_PRIVACY_POLICY_URL }}
          VITE_PRIVACY_POLICY_VERSION: ${{ vars.TRAINORACLE_PRIVACY_POLICY_VERSION }}
          VITE_TERMS_OF_SERVICE_URL: ${{ vars.TRAINORACLE_TERMS_OF_SERVICE_URL }}
          VITE_TERMS_OF_SERVICE_VERSION: ${{ vars.TRAINORACLE_TERMS_OF_SERVICE_VERSION }}
        run: |
          npm ci
          node scripts/validate-hosted-release-env.mjs
          npm run build

      - name: Publish verified build to gh-pages
        shell: bash
        run: |
          git fetch origin gh-pages
          PREVIOUS_PAGES_SHA="$(git rev-parse origin/gh-pages)"
          export PREVIOUS_PAGES_SHA
          export SOURCE_SHA="${{ github.sha }}"
          export WORKFLOW_RUN_ID="${{ github.run_id }}"
          export WORKFLOW_ATTEMPT="${{ github.run_attempt }}"
          node --input-type=module <<'NODE'
          import { writeFileSync } from "node:fs"

          const receipt = {
            kind: "TRAINORACLE_PAGES_DEPLOYMENT",
            sourceSha: process.env.SOURCE_SHA,
            previousPagesSha: process.env.PREVIOUS_PAGES_SHA,
            workflowRunId: process.env.WORKFLOW_RUN_ID,
            workflowAttempt: process.env.WORKFLOW_ATTEMPT,
            deployedAt: new Date().toISOString(),
          }
          writeFileSync("app/dist/trainoracle-deploy-receipt.json", `${JSON.stringify(receipt, null, 2)}\n`)
          NODE
          git worktree add "$RUNNER_TEMP/trainoracle-pages" origin/gh-pages
          find "$RUNNER_TEMP/trainoracle-pages" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R app/dist/. "$RUNNER_TEMP/trainoracle-pages/"
          touch "$RUNNER_TEMP/trainoracle-pages/.nojekyll"
          cd "$RUNNER_TEMP/trainoracle-pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Hosted build is already current."
            exit 0
          fi
          git commit -m "deploy: verified app from main ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
          {
            echo "### deployment receipt"
            echo "- source: \`${GITHUB_SHA}\`"
            echo "- previous Pages: \`${PREVIOUS_PAGES_SHA}\`"
            echo "- deployed Pages: \`$(git rev-parse HEAD)\`"
          } >> "$GITHUB_STEP_SUMMARY"
