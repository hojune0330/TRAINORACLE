name: TrainOracle CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

# One run per PR revision; only main pushes publish. Do not cancel an in-flight
# main publication, whose guarded push must finish atomically.
concurrency:
  group: trainoracle-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  delivery-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
      reused: ${{ steps.scope.outputs.reused }}
      reuse_run: ${{ steps.scope.outputs.reuse_run }}
      reuse_tree: ${{ steps.scope.outputs.reuse_tree }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test .tools/ci-delivery-scope.test.cjs .tools/ci-reuse-pr.test.cjs
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .tools/ci-delivery-scope.cjs

  contract-tests:
    if: needs.delivery-scope.outputs.full == 'true'
    needs: delivery-scope
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            runtime-evidence/d9-evaluator/package-lock.json
            impl/package-lock.json
            supabase/tests/local-postgres/package-lock.json
            app/package-lock.json

      - name: Validate reasoning-tier work harness
        run: |
          node --test .tools/pages-release-safety.test.mjs .tools/manual-release-lock.test.mjs .tools/oracle-public-release-config.test.mjs .tools/repository-freshness.test.mjs
          node --test .tools/prepare-cloudflare-pages.test.mjs .tools/check-release-channels.test.mjs
          node --test specs/test-packages/reasoning-tier-harness.test.mjs
          node specs/test-packages/reasoning-tier-harness.mjs validate
          node specs/test-packages/validate-formal-approval-foundation.mjs
          node --test specs/test-packages/validate-personalized-prescription-policy.test.mjs
          node specs/test-packages/validate-personalized-prescription-policy.mjs
          node --test specs/test-packages/validate-v2-seed-05-owner-activation.test.mjs
          node specs/test-packages/validate-v2-seed-05-owner-activation.mjs
          node --test specs/test-packages/validate-middle-distance-source-adoption.test.mjs
          node specs/test-packages/validate-middle-distance-source-adoption.mjs
          node specs/test-packages/validate-formation-p1-target-plans.mjs
          node specs/test-packages/test-wo016-gate-verifier.mjs
          node --test specs/test-packages/validate-detailed-prescription-catalog.test.mjs
          node specs/test-packages/validate-detailed-prescription-catalog.mjs
          node --test specs/test-packages/validate-v2-seed-05-activation-packet.test.mjs
          node specs/test-packages/validate-v2-seed-05-activation-packet.mjs
          node --test specs/test-packages/validate-advisory-session-recommender.test.mjs
          node specs/test-packages/validate-advisory-session-recommender.mjs
          node --test specs/test-packages/validate-dependency-security-audit.test.mjs
          node specs/test-packages/validate-dependency-security-audit.mjs
          node --test specs/test-packages/validate-decoration-assets.test.mjs
          node specs/test-packages/validate-journal-decoration-contract.mjs
          node --test specs/test-packages/validate-journal-decoration-contract.test.mjs
          node --test specs/test-packages/validate-personalized-prescription-v2-authority.test.mjs
          node specs/test-packages/validate-personalized-prescription-v2-authority.mjs
          node --test specs/test-packages/validate-personalized-prescription-v2-taper-authority.test.mjs
          node specs/test-packages/validate-personalized-prescription-v2-taper-authority.mjs
          node --test specs/test-packages/validate-personalized-prescription-v2-race-placement.test.mjs
          node specs/test-packages/validate-personalized-prescription-v2-race-placement.mjs

      - name: Verify publication and reconciliation guards
        run: node --test .tools/pages-release-safety.test.mjs .tools/manual-release-lock.test.mjs .tools/oracle-public-release-config.test.mjs .tools/repository-freshness.test.mjs

      - name: Install shared schema fixture compiler dependencies
        working-directory: app
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify plan lifecycle foundation
        run: node --test supabase/tests/account-plan-lifecycle.test.mjs

      - name: Install isolated PostgreSQL rehearsal dependencies
        working-directory: supabase/tests/local-postgres
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Rehearse V6 migration and account isolation in memory
        working-directory: supabase/tests/local-postgres
        run: npm test

      - name: Verify closed lounge operation rollback
        run: node --test supabase/operations/lounge-closure-operator.test.mjs

      - name: Verify COROS protocol and encrypted daily transport
        run: node --test supabase/tests/coros-*.test.mjs

      - name: Install D9 evaluator dependencies
        working-directory: runtime-evidence/d9-evaluator
        run: npm ci

      - name: Run D9 evaluator evidence tests
        working-directory: runtime-evidence/d9-evaluator
        run: npm test

      - name: Install impl dependencies
        working-directory: impl
        run: npm ci

      - name: Typecheck impl skeleton
        working-directory: impl
        run: npm run typecheck

      - name: Run impl skeleton tests
        working-directory: impl
        run: npm test

  app-unit:
    if: needs.delivery-scope.outputs.full == 'true'
    needs: delivery-scope
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - timezone: UTC
            tz: UTC
            script: test:unit
          - timezone: KST
            tz: Asia/Seoul
            script: test:unit:kst
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Run app unit tests
        working-directory: app
        env:
          TZ: ${{ matrix.tz }}
          UNIT_TEST_SCRIPT: ${{ matrix.script }}
        run: npm run "$UNIT_TEST_SCRIPT"

  app-quality:
    # Independent build/type checks need not wait for both long unit lanes.
    # delivery-complete still requires every unit and browser result to pass.
    needs: delivery-scope
    if: needs.delivery-scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Verify hosted release environment and device integration
        working-directory: app
        run: |
          npm run test:release-env
          npm run test:device-integration

      - name: Verify shared account journal record validator
        working-directory: app
        run: npm run test:account-record-validator

      - name: Verify shared encrypted account state validator
        working-directory: app
        run: npm run test:account-state-validator

      - name: Typecheck app and browser tests
        working-directory: app
        run: |
          npm run typecheck
          npm run typecheck:e2e

      - name: Build production app
        working-directory: app
        run: npm run build

      - name: Preserve the tested generic browser bundle
        uses: actions/upload-artifact@v4
        with:
          name: browser-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/dist
          if-no-files-found: error
          retention-days: 1

  app-browser-generic:
    if: needs.delivery-scope.outputs.full == 'true'
    needs: [delivery-scope, app-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop-chromium
          - mobile-chromium
          - touch-narrow
          - reduced-motion
        lane:
          - built-preview
          - browser-fixtures
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Restore the tested generic browser bundle
        if: matrix.lane == 'built-preview'
        uses: actions/download-artifact@v4
        with:
          name: browser-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/dist

      - name: Install loopback arena fixture dependencies
        if: matrix.lane == 'browser-fixtures'
        working-directory: game-server
        run: npm ci --ignore-scripts

      - name: Run the complete browser lane for the project
        working-directory: app
        run: node e2e/run-project-lane-suite.mjs '${{ matrix.project }}' '${{ matrix.lane }}'

      - name: Retain synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.project }}-${{ matrix.lane }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/test-results/full-browser
          if-no-files-found: ignore
          retention-days: 3

  app-browser-dedicated:
    if: needs.delivery-scope.outputs.full == 'true'
    needs: [delivery-scope, app-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Verify calendar decoration interaction
        working-directory: app
        run: npm run test:e2e:calendar-decoration

      - name: Verify full tower defense rounds and touch controls
        working-directory: app
        run: npm run test:e2e:tower-defense

      - name: Verify encrypted account journal buffer and record recovery
        working-directory: app
        run: |
          npm run test:e2e:account-draft-buffer
          npm run test:e2e:account-draft-panel
          npm run test:e2e:account-record-service
          npm run test:e2e:account-conflict
          npm run test:e2e:account-decoration
          npm run test:e2e:account-calendar-decoration
          npm run test:e2e:account-plan-service
          npm run test:e2e:form-input-autosave
          npm run test:e2e:file-analysis

      - name: Retain synthetic dedicated failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dedicated-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/test-results
          if-no-files-found: ignore
          retention-days: 3

  app-browser:
    needs:
      - delivery-scope
      - app-browser-generic
      - app-browser-dedicated
    if: ${{ always() && needs.delivery-scope.outputs.full != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all browser projects and dedicated scenarios to pass
        shell: bash
        env:
          GENERIC_RESULT: ${{ needs.app-browser-generic.result }}
          DEDICATED_RESULT: ${{ needs.app-browser-dedicated.result }}
        run: |
          if [[ "$GENERIC_RESULT" != "success" || "$DEDICATED_RESULT" != "success" ]]; then
            echo "::error::All browser coverage must pass; generic result is '$GENERIC_RESULT', dedicated result is '$DEDICATED_RESULT'."
            exit 1
          fi

  delivery-complete:
    if: ${{ always() }}
    needs: [delivery-scope, contract-tests, app-unit, app-quality, app-browser-generic, app-browser-dedicated, app-browser]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Verify the selected checks completed
        env:
          DELIVERY_NEEDS: ${{ toJSON(needs) }}
        run: node -e "console.log(require('./.tools/ci-delivery-scope.cjs').assertDeliveryResults(JSON.parse(process.env.DELIVERY_NEEDS)))"

  deploy-pages:
    # A merge may reuse the identical PR tree's successful full checks.
    if: always() && needs.delivery-complete.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && (needs.delivery-scope.outputs.full == 'true' || needs.delivery-scope.outputs.reused == 'true') && !contains(github.event.head_commit.message, '[manual-pages]')
    needs:
      - delivery-scope
      - delivery-complete
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pages: write
    concurrency:
      group: trainoracle-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Verify source is current main
        id: deployment-source
        shell: bash
        run: |
          git fetch origin main
          CURRENT_MAIN_SHA="$(git rev-parse origin/main)"
          if [[ "$GITHUB_SHA" == "$CURRENT_MAIN_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "current=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping stale deployment source $GITHUB_SHA; current main is $CURRENT_MAIN_SHA."

      - name: Fetch current Pages snapshot
        id: pages-snapshot
        if: steps.deployment-source.outputs.current == 'true'
        shell: bash
        run: |
          git fetch origin gh-pages
          PAGES_SHA="$(git rev-parse origin/gh-pages)"
          echo "sha=$PAGES_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        if: steps.deployment-source.outputs.current == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        if: steps.deployment-source.outputs.current == 'true'
        working-directory: app
        run: npm ci

      - name: Build account-held release package
        if: steps.deployment-source.outputs.current == 'true'
        shell: bash
        run: |
          node .tools/build-oracle-pages-release.mjs --account-held --out="$RUNNER_TEMP/trainoracle-pages-bundle"

      - name: Publish verified package to gh-pages
        id: publish-pages
        if: steps.deployment-source.outputs.current == 'true'
        shell: bash
        run: |
          PAGES_WORKTREE="$RUNNER_TEMP/trainoracle-pages"
          git worktree add "$PAGES_WORKTREE" "${{ steps.pages-snapshot.outputs.sha }}"
          git -C "$PAGES_WORKTREE" config user.name "github-actions[bot]"
          git -C "$PAGES_WORKTREE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          RESULT="$(node .tools/publish-oracle-pages-release.mjs --bundle="$RUNNER_TEMP/trainoracle-pages-bundle" --pages-worktree="$PAGES_WORKTREE" --publish)"
          echo "$RESULT"
          DEPLOYED_PAGES_SHA="$(git -C "$PAGES_WORKTREE" rev-parse HEAD)"
          {
            echo "### deployment receipt"
            echo "- source: \`$GITHUB_SHA\`"
            echo "- previous Pages: \`${{ steps.pages-snapshot.outputs.sha }}\`"
            echo "- deployed Pages: \`$DEPLOYED_PAGES_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "pages_sha=$DEPLOYED_PAGES_SHA" >> "$GITHUB_OUTPUT"

      - name: Request and verify GitHub Pages build
        if: steps.deployment-source.outputs.current == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_PAGES_SHA: ${{ steps.publish-pages.outputs.pages_sha }}
        run: |
          set -euo pipefail

          git fetch --quiet origin main gh-pages
          REMOTE_MAIN_SHA="$(git rev-parse origin/main)"
          REMOTE_PAGES_SHA="$(git rev-parse origin/gh-pages)"
          if [[ "$REMOTE_MAIN_SHA" != "$EXPECTED_SOURCE_SHA" || "$REMOTE_PAGES_SHA" != "$EXPECTED_PAGES_SHA" ]]; then
            echo "::error::Refusing Pages build request because remote refs moved (main=$REMOTE_MAIN_SHA, gh-pages=$REMOTE_PAGES_SHA)."
            exit 1
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent

          for attempt in {1..30}; do
            git fetch --quiet origin main gh-pages
            REMOTE_MAIN_SHA="$(git rev-parse origin/main)"
            REMOTE_PAGES_SHA="$(git rev-parse origin/gh-pages)"
            if [[ "$REMOTE_MAIN_SHA" != "$EXPECTED_SOURCE_SHA" || "$REMOTE_PAGES_SHA" != "$EXPECTED_PAGES_SHA" ]]; then
              echo "::error::Remote refs moved while waiting for the Pages build (main=$REMOTE_MAIN_SHA, gh-pages=$REMOTE_PAGES_SHA)."
              exit 1
            fi

            BUILD="$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest")"
            BUILD_SHA="$(jq -r '.commit // empty' <<<"$BUILD")"
            BUILD_STATUS="$(jq -r '.status // empty' <<<"$BUILD")"
            if [[ "$BUILD_SHA" == "$EXPECTED_PAGES_SHA" ]]; then
              case "$BUILD_STATUS" in
                built)
                  echo "Pages build completed for $EXPECTED_PAGES_SHA."
                  {
                    echo "- Pages build: \`$EXPECTED_PAGES_SHA\` ($BUILD_STATUS)"
                  } >> "$GITHUB_STEP_SUMMARY"
                  exit 0
                  ;;
                error|errored|stale)
                  echo "::error::GitHub Pages build for $EXPECTED_PAGES_SHA finished with status '$BUILD_STATUS'."
                  exit 1
                  ;;
                queued|building)
                  ;;
                *)
                  echo "::error::Unexpected GitHub Pages build status '$BUILD_STATUS' for $EXPECTED_PAGES_SHA."
                  exit 1
                  ;;
              esac
            fi
            sleep 10
          done

          echo "::error::Timed out waiting for GitHub Pages build of $EXPECTED_PAGES_SHA to reach status 'built'."
          exit 1
