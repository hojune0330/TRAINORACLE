name: Garmin deployment credential reminder
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: read
jobs:
  credential-expiry:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test server/garmin-integration/check-deployment-expiry.test.mjs
      - run: node server/garmin-integration/check-deployment-expiry.mjs
