<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>러닝 파티 · 추가 에셋 검수</title>
<style>
:root{color-scheme:light;--ink:#252337;--muted:#586174;--mint:#20bea7;--paper:#f5f6f8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:40px 24px}h1{font-size:30px;line-height:1.3;margin:8px 0}p{color:var(--muted)}.tag{color:#087f70;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:28px 0}article{background:white;border-radius:20px;padding:20px}h2{font-size:21px;margin:12px 0 4px}.stage{height:260px;display:grid;place-items:center;background:#edf3f3;border-radius:14px}.sprite{width:256px;height:256px;background-repeat:no-repeat;max-width:100%}button{min-height:48px;border:0;border-radius:12px;padding:10px 18px;background:#d9f6ef;color:#096c5c;font:inherit;font-weight:700;width:100%;cursor:pointer}button:focus-visible{outline:3px solid #252337;outline-offset:3px}.small{display:flex;align-items:center;gap:14px;margin:20px 0}.icon64{width:64px;height:64px;flex:none;background-size:192px 128px}.status{min-height:26px;font-size:14px}footer{margin-top:28px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}main{padding:24px 16px}h1{font-size:26px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style><main><span class="tag">TRIPO · RUN PARTY</span><h1>맵에서 발견하고, 짧게 반응하는 소품</h1><p>실제 생성 모델에서 만든 아이콘과 효과 시안입니다. 게임 연결 전 검수 화면입니다.</p><div class="grid" id="assets"></div><footer id="receipt"></footer></main>
<script>
const base='../../../app/public/game/run-party-v2/';
const uses=['점프 위치를 미리 알려주는 맵 소품','보급 획득 때 짧게 솟아오르는 캡슐','강화 선택 전후에 한 번 반응하는 코어'];
const names=['발판 활성화','보급 획득','강화 확인'];
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
fetch(base+'manifest.json').then(r=>{if(!r.ok)throw Error('manifest');return r.json()}).then(m=>{
document.querySelector('#receipt').textContent=`모델 3종 · 아이콘 3종 · 효과 24프레임 · 전송량 ${(m.payloadBytes/1024).toFixed(1)} KiB. 원형: Tripo / 움직임·링·입자: 로컬 제작.`;
m.assets.forEach((a,i)=>{
const card=document.createElement('article');card.innerHTML=`<div class="stage"><div class="sprite" role="img" aria-label="${a.label}"></div></div><h2>${a.label}</h2><p>${uses[i]}</p><div class="small"><div class="icon64" aria-hidden="true"></div><span>64px 맵 아이콘</span></div><button type="button">${names[i]}</button><div class="status" aria-live="polite"></div>`;
document.querySelector('#assets').append(card);const sprite=card.querySelector('.sprite'),icon=card.querySelector('.icon64'),status=card.querySelector('.status');
const rect=a.views.find(v=>v.kind==='icon').rect;
function still(){sprite.style.backgroundImage=`url(${base+m.icons.file})`;sprite.style.backgroundPosition=`-${rect[0]}px -${rect[1]}px`;}
still();icon.style.backgroundImage=`url(${base+m.icons.file})`;icon.style.backgroundPosition=`-${rect[0]/4}px -${rect[1]/4}px`;
let raf=0;const fx=new Image();fx.src=base+a.effect.file;
card.querySelector('button').onclick=async()=>{cancelAnimationFrame(raf);try{await fx.decode()}catch{status.textContent='효과를 불러오지 못했어요.';return}if(reduce.matches){still();status.textContent='움직임 줄이기 · 정적 아이콘 표시';return}status.textContent='효과 재생 중';const start=performance.now();sprite.style.backgroundImage=`url(${fx.src})`;
function frame(now){const t=now-start;if(t>=a.effect.durationMs){still();status.textContent='효과 완료';return}const r=a.effect.frames[Math.min(7,Math.floor(t/80))];sprite.style.backgroundPosition=`-${r[0]}px -${r[1]}px`;raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)};
});
}).catch(()=>document.querySelector('#receipt').textContent='에셋을 불러오지 못했어요. 검수 서버에서 열어 주세요.');
</script></html>
